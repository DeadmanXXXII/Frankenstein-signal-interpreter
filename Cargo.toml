[package]
name = "Frankenstein-signal-interpreter"
version = "0.1.0"
edition = "2021"
description = "Receive-only SDR capture and decoding for public/amateur bands — NOAA APT, ADS-B, AIS, HAM."
license = "MIT"

[[bin]]
name = "frankenstein"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pure-Rust RTL-SDR driver (needs libusb at runtime). Receive-only — this
# crate has no transmit path and none is added on top of it.
# NOTE: previously pinned as `rtlsdr-rs = "0.1.4"`, which is the wrong
# crate entirely (an abandoned 2018 bindgen binding that only ever
# published 0.1.0 — that version mismatch was breaking `cargo build`
# on every platform). `seify-rtlsdr` is the pure-Rust/rusb driver this
# code's API (RtlSdr::open/reset_buffer/read_sync/set_center_freq/
# set_sample_rate) actually matches.
seify-rtlsdr = "0.0.4"
