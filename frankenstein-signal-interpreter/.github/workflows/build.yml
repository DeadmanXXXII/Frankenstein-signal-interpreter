name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Frankenstein-windows.exe
            bin_path: target/release/frankenstein.exe
          - os: macos-latest
            artifact: Frankenstein-macos
            bin_path: target/release/frankenstein
          - os: ubuntu-latest
            artifact: Frankenstein-linux
            bin_path: target/release/frankenstein

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI + libusb build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev libusb-1.0-0-dev

      - name: Install libusb (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libusb

      # rtlsdr-rs needs libusb at build+link time. vcpkg is the standard way
      # to get a usable libusb on the windows-latest runner (it ships
      # vcpkg already). NOTE: I could not network-test this step — verify
      # it locally / let the first CI run confirm it before relying on it.
      - name: Install libusb (Windows, via vcpkg)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install libusb:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.bin_path }}" "${{ matrix.artifact }}"

      # --- Windows-only: Authenticode-sign the exe, then package + sign an
      # MSIX for Microsoft Store / sideload distribution. Requires these
      # repo secrets to be set (Settings -> Secrets and variables -> Actions):
      #   WINDOWS_CERTIFICATE_BASE64  — your .pfx code-signing cert, base64-encoded
      #   WINDOWS_CERTIFICATE_PASSWORD — that .pfx's password
      # If those secrets aren't set yet, this step is skipped rather than
      # failing the build, so plain .exe builds keep working in the meantime.
      - name: Sign executable
        if: matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}")
          [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ matrix.artifact }}"
          Remove-Item cert.pfx

      - name: Build .msixbundle
        if: matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        run: |
          $pkgDir = "msix_staging"
          New-Item -ItemType Directory -Force -Path "$pkgDir\Assets" | Out-Null
          Copy-Item "${{ matrix.artifact }}" "$pkgDir\frankenstein.exe"
          Copy-Item "packaging\windows\AppxManifest.xml" "$pkgDir\AppxManifest.xml"
          # NOTE: assumes Cargo.toml/assets/packaging sit at the repo root.
          # Adjust these three paths if your repo nests the project a level
          # deeper (as the uploaded zip's folder structure suggested it might).
          Copy-Item "assets\logo.png" "$pkgDir\Assets\StoreLogo.png"
          Copy-Item "assets\logo.png" "$pkgDir\Assets\Square150x150Logo.png"
          Copy-Item "assets\logo.png" "$pkgDir\Assets\Square44x44Logo.png"

          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          & $makeappx.FullName pack /d $pkgDir /p Frankenstein.msix /o

          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}")
          [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 Frankenstein.msix
          Remove-Item cert.pfx

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload .msix artifact
        if: matrix.os == 'windows-latest' && env.HAS_CERT == 'true'
        uses: actions/upload-artifact@v4
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        with:
          name: Frankenstein.msix
          path: Frankenstein.msix
